name: Verify and deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate pinned Skill plugins and Registry V2
        run: npm run test:skills
      - name: Run catalog, graph, Agent and runtime regression tests
        run: npm test
      - name: Smoke-test Agent-native CLI registry and L0-L2 pipeline
        run: |
          npm run world:run -- registry > /dev/null
          node adapters/cli/world.mjs pipeline --prompt "搭建一辆六轮火星探测车" > /tmp/lego-world-pipeline.json
          node -e 'const p=require("/tmp/lego-world-pipeline.json"); if(p.status!=="ok" || !p.artifacts.some(a=>a.kind==="ValidationReport")) process.exit(1)'

      - name: Verify V0.9 nominal bearing fit and sampled insertion
        run: |
          node scripts/inspect-bearing-wheel.mjs > /tmp/bearing-clearance.json
          node -e 'const r=require("/tmp/bearing-clearance.json"); if(r.status!=="ok" || !r.checks.some(c=>c.code==="SAMPLED_PATH_CLEAR")) process.exit(1)'
      - name: Build static site
        run: npm run build
      - name: Verify Pages output and base path
        run: |
          test -s dist/index.html
          grep -q '/LEGO-Worlds/' dist/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
